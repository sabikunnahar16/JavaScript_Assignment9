<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DOM Manipulation Practice</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <h1 id="title">

        DOM Manipulation Practice

    </h1>


    <!-- Select Elements -->

    <section class="card">

        <h2>Select Elements</h2>

        <p class="box">

            This is sabikun nahar

        </p>

        <p class="box">

            This is Marzia

        </p>

    </section>



    <!-- Change Content -->

    <section class="card">

        <h2>Change Content & Style</h2>

        <button id="changeTextBtn">

            Change Text

        </button>

        <button id="changeHTMLBtn">

            Change HTML

        </button>

        <button id="changeStyleBtn">

            Change Style

        </button>

    </section>



    <!-- Create Element -->

    <section class="card">

        <h2>Create New Element</h2>

        <button id="addBtn">

            Add New Element

        </button>

        <div id="newContainer">

        </div>

    </section>



    <!-- Remove Element -->

    <section class="card">

        <h2>Remove Element</h2>

        <p id="removeMe" class="removeBox">

            Remove this paragraph

        </p>

        <button id="removeBtn">

            Remove

        </button>

    </section>



    <!-- Click Event -->

    <section class="card">

        <h2>Click Event</h2>

        <button id="clickBtn">

            Click Me

        </button>

    </section>



    <!-- Input Event -->

    <section class="card">

        <h2>Input Event</h2>

        <input

        type="text"

        id="inputBox"

        placeholder="Type something...">


        <p id="display">

            You typed:

        </p>

    </section>



    <!-- Submit Event -->

    <section class="card">

        <h2>Submit Event</h2>

        <form id="myForm">

            <input

            type="text"

            placeholder="Enter your name"

            required>


            <button type="submit">

                Submit

            </button>

        </form>

    </section>

</div>

<script src="script.js"></script>

</body>

</html>
